# For every version tag (v0.1.0 …): builds Nachtzug for Linux (an AppImage, in Debian 13), macOS (a disk image, on
# Apple Silicon) and Windows (an installer), each checked with its self-test, and puts them on the version's GitHub
# release with the source code, both manuals, and for each download the exact source of the libraries inside it
# (tools/library-sources.sh), as their licences ask. The website's download tickets point at the latest release.
# "Run workflow" on the Actions page builds all three without releasing anything, to try a change out.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NACHTZUG_WERROR: "1"   # a warning stops the build (CMakeLists.txt)

jobs:
  linux:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake qt6-base-dev qt6-base-dev-tools qt6-tools-dev qt6-l10n-tools qt6-qpa-plugins qt6-wayland \
            libsdl2-dev libasound2-dev libgl-dev file curl git ca-certificates
          # Debian's source lists too, for the libraries' sources
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          apt-get update
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The AppImage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sh tools/build-appimage.sh
      - name: The libraries' sources
        run: |
          tools/library-sources.sh build-appimage/AppDir dist/Nachtzug-Linux-library-sources
          tar -cf dist/Nachtzug-Linux-library-sources.tar -C dist Nachtzug-Linux-library-sources
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/Nachtzug-x86_64.AppImage
            dist/Nachtzug-Linux-library-sources.tar
          if-no-files-found: error

  macos:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: The disk image
        run: |
          tools/build-macos.sh
          mv build-macos/Nachtzug.dmg Nachtzug-macOS.dmg
      - name: The libraries' sources
        run: |
          tools/library-sources.sh build-macos/Nachtzug.app Nachtzug-macOS-library-sources
          tar -cf Nachtzug-macOS-library-sources.tar Nachtzug-macOS-library-sources
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            Nachtzug-macOS.dmg
            Nachtzug-macOS-library-sources.tar
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-SDL2 mingw-w64-ucrt-x86_64-ntldd
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: The installer
        run: |
          tools/build-windows.sh
          test -f build-windows/Nachtzug-Setup.exe
          mv build-windows/Nachtzug-Setup.exe Nachtzug-Windows-Setup.exe
      - name: The libraries' sources
        run: |
          tools/library-sources.sh build-windows/package/Nachtzug Nachtzug-Windows-library-sources
          tar -cf Nachtzug-Windows-library-sources.tar Nachtzug-Windows-library-sources
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Nachtzug-Windows-Setup.exe
            Nachtzug-Windows-library-sources.tar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The source code and the release notes
        run: |
          git archive --format=tar.gz --prefix=nachtzug/ -o dist/Nachtzug-source.tar.gz HEAD
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > dist/notes.md
          cat .github/release-footer.md >> dist/notes.md
      - name: Onto the release
        uses: softprops/action-gh-release@v2
        with:
          name: Nachtzug ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/Nachtzug-x86_64.AppImage
            dist/Nachtzug-macOS.dmg
            dist/Nachtzug-Windows-Setup.exe
            dist/Nachtzug-source.tar.gz
            dist/Nachtzug-Linux-library-sources.tar
            dist/Nachtzug-macOS-library-sources.tar
            dist/Nachtzug-Windows-library-sources.tar
            docs/Nachtzug-Manual.pdf
            docs/Nachtzug-Handbuch.pdf
