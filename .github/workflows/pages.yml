# Builds the website (site/, Jekyll) and puts it on GitHub Pages: mjohanning99.github.io/nachtzug.
# On the public GitHub repository only; the private repository builds the site with .forgejo/workflows/site.yml.
name: Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: site
      - name: Build
        working-directory: site
        env:
          JEKYLL_ENV: production
          TZ: Europe/Berlin
        run: |
          sh prepare.sh
          bundle exec jekyll build --config _config.yml,_config.github.yml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
