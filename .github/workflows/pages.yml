# Keeps the old address of the website, mjohanning99.github.io/nachtzug, working: GitHub Pages serves only a page that
# sends every visitor on to the same place at nachtzugmusic.com (.github/pages-forward/index.html, as index.html and
# as 404.html, so any old path is caught). Copies of Nachtzug up to 0.3.4 open their manual at the old address.
# The website itself is built and put on our own server by .forgejo/workflows/site.yml, at each version.
name: Website forwarding

on:
  push:
    branches: [main]
    paths: [".github/pages-forward/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The forwarding page
        run: |
          mkdir -p out
          cp .github/pages-forward/index.html out/index.html
          cp .github/pages-forward/index.html out/404.html
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
