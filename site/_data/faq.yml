- q: "Do I need to be able to play the keyboard?"
  a: "Not at all! That’s the whole idea. Every key and every row of the note grid is a note of your song’s scale, so nothing you press can sound wrong. And if you’d like a little tension, hold <span class=\"key\">Shift</span> for the <i>right</i> wrong notes."
- q: "What does it cost?"
  a: "Nothing, and it never will. Nachtzug is free software under the GNU GPL: you may use it, share it and change it. The music you make with it is yours, completely, and the built-in sounds are in the public domain, so you can use them in your songs however you like."
- q: "Do I need to know music theory?"
  a: "No. You pick a key and a scale from a list (“A natural minor” is a fine start), and Nachtzug does the rest: the chords, which notes fit, and ideas when you’re stuck. You’ll pick up a bit of theory on the way, if you want to."
- q: "Which computers does it run on?"
  a: "Linux and macOS. On Linux, the AppImage runs on distributions from 2025 on (Debian 13, Ubuntu 25.04, Fedora 42, Arch, CachyOS and friends); on older ones you can build it yourself in about ten minutes. On a Mac, a script builds it for you. Windows is ready but hasn’t been tried on a real Windows computer yet."
- q: "Can I use my MIDI keyboard and knobs?"
  a: "Yes. A MIDI keyboard plays the nearest note of the scale, hard notes are accented, and any knob in Nachtzug can learn a knob on your controller. Nachtzug can follow MIDI clock, too."
- q: "Can I take my music into another program?"
  a: "Of course. Export the song as a WAV file, as one WAV file per track, or as a MIDI file with every note just as you hear it, arpeggios and all."
- q: "Is there a German version?"
  a: "Ja! The program speaks English and German, and the manual comes in both languages: <a href=\"#manual\">Bedienungsanleitung</a>."
- q: "Will I lose my song if something crashes?"
  a: "Don’t worry. Every change can be undone, and Nachtzug quietly keeps a spare copy of your song, which it offers you the next time you start it."
- q: "Where are my songs kept?"
  a: "Wherever you save them, as <code>.nachtzug</code> files. They’re plain text inside (JSON), so they’re small and will still open in many years."
