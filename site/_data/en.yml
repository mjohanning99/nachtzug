stations_heading: "A night’s journey through Nachtzug"
stations_intro: "Every stop is a part of the program, in the order you’d meet them."

stations:
  - { time: "22:58", stop: "Keyboard Hbf", icon: keys, title: "Play along on your keyboard", short: "Three rows of letter keys play three octaves, every key a note of the song’s scale." }
  - { time: "23:06", stop: "Ideenfeld Ost", icon: idea, title: "Ideas at a press", short: "<b>New idea</b> writes an acid line, a Berlin School sequence, chords or a beat; <b>Vary</b> changes a note or two." }
  - { time: "23:14", stop: "Drummersdorf Süd", icon: drum, title: "A tireless drummer", short: "Pick a style and how hard it plays; it adds fills by itself." }
  - { time: "23:21", stop: "Knob Street West", icon: knob, title: "A real synthesiser", short: "On every track, with live pictures of what each knob does, or a <b>Simple</b> page of eight big knobs." }
  - { time: "23:40", stop: "Loop Grid Abstellbahnhof", icon: grid, title: "Jam like a live set", short: "Start and stop patterns while it plays; every change waits for the next bar." }
  - { time: "23:52", stop: "Arrangement Viaduct Nord", icon: arrange, title: "From a loop to a song", short: "Lay out clips yourself, or let <b>Arrange</b> make an intro, a build-up, a break and an ending." }
  - { time: "00:15", stop: "Sample Gbf", icon: wave, title: "Your own sounds", short: "65 sounds made for Nachtzug, nine of them from a night train, your samples, or a chopped drum loop." }
