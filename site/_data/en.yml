build_heading: "Building Nachtzug yourself"
build_intro: "Don’t let that put you off: it’s a handful of commands, and you only have to do it once."
build:
  - label: "On Linux"
    html: "<p>Install the tools. On Arch:</p><pre><code>sudo pacman -S --needed base-devel cmake qt6-base qt6-tools sdl2 alsa-lib git</code></pre><p>On Debian or Ubuntu:</p><pre><code>sudo apt install build-essential cmake qt6-base-dev qt6-tools-dev qt6-l10n-tools libsdl2-dev libasound2-dev git</code></pre><p>Then unpack the source code and run these two in its folder:</p><pre><code>cmake -B build\ncmake --build build -j</code></pre><p><code>./build/nachtzug</code> starts it.</p>"
  - label: "On a Mac"
    html: "<p>Install Apple’s command line tools (<code>xcode-select --install</code>) and <a href=\"https://brew.sh\">Homebrew</a>, then unpack the source code and run this in its folder:</p><pre><code>tools/build-macos.sh</code></pre><p>It installs everything else, builds the app and packs it into a disk image.</p>"
  - label: "On Windows"
    html: "<p>Install <a href=\"https://www.msys2.org\">MSYS2</a>, open the <b>MSYS2 UCRT64</b> terminal from the Start menu, then unpack the source code and run this in its folder:</p><pre><code>tools/build-windows.sh</code></pre><p>It installs the compiler and everything else, builds Nachtzug and makes an installer (with <a href=\"https://jrsoftware.org/isinfo.php\">Inno Setup</a> installed) or a zip.</p>"

