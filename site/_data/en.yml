manual_title: "Bordbuch · The manual"
manual_heading: "An operation manual, as it should be"
manual_text: "Nachtzug comes with a proper printed manual, the way old synthesisers did: an A5 booklet with pictures of every part, sound recipes, patch sheets to fill in, a table of every key and an index. Inside the program, <span class=\"key\">F1</span> opens a short guide, and almost every button and knob explains itself when you rest the mouse on it."
