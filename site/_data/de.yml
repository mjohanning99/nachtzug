faq_title: "Fahrgastinformation · Fragen"
faq_heading: "Vor dem Einsteigen"
faq:
  - q: "Muss man Keyboard spielen können?"
    a: "Überhaupt nicht. Genau darum geht es. Jede Taste und jede Zeile des Notenrasters ist eine Note aus der Tonleiter des Songs, deshalb kann nichts falsch klingen. Und wer ein wenig Spannung möchte, hält <span class=\"key\">Umschalt</span> gedrückt: für die „richtigen falschen Töne“."
  - q: "Was kostet es?"
    a: "Nichts, und das bleibt so. Nachtzug ist freie Software unter der GNU GPL: Es darf benutzt, weitergegeben und verändert werden. Die Musik, die damit entsteht, gehört ganz dem, der sie macht, und die eingebauten Klänge sind gemeinfrei."
  - q: "Braucht man Musiktheorie?"
    a: "Nein. Tonart und Tonleiter werden aus einer Liste gewählt („a-Moll“ ist ein guter Anfang), und Nachtzug macht den Rest: die Akkorde, welche Noten passen, und Ideen, wenn man nicht weiterweiß. Ein bisschen Theorie lernt man nebenbei, ohne es zu merken."
  - q: "Auf welchen Computern läuft es?"
    a: "Linux, macOS und Windows. Unter Linux läuft das AppImage auf Distributionen ab 2025 (Debian 13, Ubuntu 25.04, Fedora 42, Arch, CachyOS und Verwandte); auf älteren lässt es sich in etwa zehn Minuten selbst bauen. Die Mac-Fassung braucht Apple Silicon und macOS 15 Sequoia oder neuer, die Windows-Fassung Windows 10 oder 11. Windows ist die jüngste; wenn sich dort etwas seltsam verhält, freue ich mich über eine Nachricht."
  - q: "Funktionieren MIDI-Keyboards und Controller?"
    a: "Ja. Ein MIDI-Keyboard spielt die nächstgelegene Note der Tonleiter, kräftige Anschläge werden betont, und jeder Regler in Nachtzug kann einen Regler am Controller lernen. Nachtzug kann auch einer MIDI-Clock folgen."
  - q: "Lässt sich die Musik in ein anderes Programm mitnehmen?"
    a: "Natürlich. Der Song lässt sich als WAV-Datei exportieren, als eine WAV-Datei pro Spur oder als MIDI-Datei mit jeder Note genau so, wie sie klingt, Arpeggios eingeschlossen."
  - q: "Gibt es Nachtzug auch auf Englisch?"
    a: "Yes! Das Programm spricht Deutsch und Englisch, die Anleitung gibt es in beiden Sprachen, und diese Seite gibt es auch <a href=\"%base%/\" hreflang=\"en\">auf Englisch</a>."
  - q: "Ist der Song weg, wenn etwas abstürzt?"
    a: "Keine Sorge. Jede Änderung lässt sich rückgängig machen, und Nachtzug bewahrt still eine Ersatzkopie des Songs auf, die beim nächsten Start angeboten wird."
  - q: "Wo werden die Songs gespeichert?"
    a: "Wo immer man sie speichert, als <code>.nachtzug</code>-Dateien. Darin steht einfacher Text (JSON), deshalb sind sie klein und lassen sich auch in vielen Jahren noch öffnen."

