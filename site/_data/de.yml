who_title: "Fahrgäste · Für wen"
who_heading: "Ein erster Schritt ins Musikmachen"
who_text: "Nachtzug will keine vollwertige DAW sein. Es ist ein Musikprogramm in der Art von GarageBand, gedacht speziell für elektronische Musik wie Acid oder Berliner Schule. Es ist als Einstieg gedacht, für alle, die noch nie Musik gemacht haben und wenig oder gar nichts darüber wissen."
who_more: "Für Fortgeschrittene, oder sobald Nachtzug zu eng wird, empfehlen wir umfangreichere Programme wie diese. Sie brauchen meist mehr Einarbeitung und kosten unter Umständen Geld, können dafür aber viel mehr."
who_connections: "Anschlüsse"
who_programs:
  - { name: "LMMS", url: "https://lmms.io", note: "Kostenlos. Patterns, eine Pianorolle und viele Instrumente, für Linux, macOS und Windows." }
  - { name: "Ardour", url: "https://ardour.org", note: "Als Quellcode kostenlos; die fertigen Downloads kosten einen kleinen, frei wählbaren Betrag. Stark bei Aufnahme und Mischen." }
  - { name: "Bitwig Studio", url: "https://www.bitwig.com", note: "Kostenpflichtig. Für elektronische Musik gemacht, mit einem modularen System für eigene Klänge." }
  - { name: "REAPER", url: "https://www.reaper.fm", note: "Kostenlos zum Ausprobieren, danach eine günstige Lizenz. Klein, schnell und vielseitig anpassbar." }
who_after: "In Nachtzug gemachte Songs lassen sich mitnehmen: als MIDI oder als eine WAV-Datei pro Spur exportiert."

stations_title: "Fahrplan · An Bord"
stations_heading: "Eine Nachtfahrt mit Nachtzug"
stations_intro: "Jeder Halt ist ein Teil des Programms, in der Reihenfolge, in der man ihnen begegnet."

stations:
  - { time: "22:58", stop: "Tastenkreuz Hbf", icon: keys, title: "Auf der Tastatur mitspielen", short: "Drei Reihen Buchstabentasten spielen drei Oktaven, jede Taste eine Note der Tonleiter des Songs." }
  - { time: "23:06", stop: "Ideenfeld Ost", icon: idea, title: "Ideen auf Knopfdruck", short: "<b>Neue Idee</b> schreibt eine Acid-Linie, eine Sequenz der Berliner Schule, Akkorde oder einen Beat; <b>Variieren</b> ändert ein, zwei Noten." }
  - { time: "23:14", stop: "Trommlers Ruh Süd", icon: drum, title: "Ein unermüdlicher Drummer", short: "Stil und Spielstärke wählen – Fills spielt er von selbst." }
  - { time: "23:21", stop: "Reglerstraße West", icon: knob, title: "Ein echter Synthesizer", short: "Auf jeder Spur, mit Live-Bildern von jedem Regler – oder eine Seite <b>Einfach</b> mit acht großen Reglern." }
  - { time: "23:40", stop: "Loops Abstellbahnhof", icon: grid, title: "Jammen wie in einem Live-Set", short: "Patterns starten und stoppen, während es spielt; jede Änderung wartet auf den nächsten Takt." }
  - { time: "23:52", stop: "Arrangement-Viadukt Nord", icon: arrange, title: "Vom Loop zum Song", short: "Die Clips lassen sich von Hand anlegen, oder <b>Arrangieren</b> macht ein Intro, einen Aufbau, einen Break und ein Ende." }
  - { time: "00:15", stop: "Sample Gbf", icon: wave, title: "Eigene Klänge", short: "65 Klänge, eigens für Nachtzug gemacht, neun davon aus einem Nachtzug, eigene Samples oder ein zerlegter Drumloop." }
  - { time: "00:51", stop: "Berliner Schule Hbf", icon: export, title: "Zum Mitnehmen", short: "Export als WAV, eine Datei pro Spur oder MIDI. MIDI-Keyboards, Regler und Clock funktionieren alle." }

