manual_title: "Bordbuch · Die Anleitung"
manual_heading: "Eine Bedienungsanleitung, wie sie sein soll"
manual_text: "Zu Nachtzug gehört eine richtige gedruckte Anleitung, wie bei alten Synthesizern: ein A5-Heft mit Bildern von jedem Teil, Klangrezepten, Patchbögen zum Ausfüllen, einer Tabelle aller Tasten und einem Register. Im Programm öffnet <span class=\"key\">F1</span> eine kurze Hilfe, und fast jeder Knopf und Regler erklärt sich selbst, wenn die Maus kurz darauf ruht."
