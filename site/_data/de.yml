hero:
  lead: "Nachtzug ist eine für Anfänger gedachte DAW – Digital Audio Workstation –, die es ermöglicht, elektronische Musik, z. B. im Stil der Berliner Schule, ohne große Vorkenntnisse zu erstellen. Auch ist es nicht nötig, sich mit Musiktheorie auszukennen. Denn: Nachtzug ist so aufgebaut, dass alle Noten automatisch in der korrekten Tonleiter landen."
  cta: "Einsteigen, bitte!"
  cta_sub: "Nachtzug herunterladen, kostenlos"
  cta_for: "Für %system%, kostenlos"   # when the page knows your computer (site.js)
  video_label: "Nachtzug spielt seinen Demosong: das Display zählt die Takte, die Pegelanzeigen bewegen sich und der Abspielkopf läuft über die Zeitleiste"
  caption: "Der Demosong läuft: acht Sekunden, ohne Ton."

