build_heading: "Nachtzug selbst bauen"
build_intro: "Kein Grund zur Sorge: Es ist eine Handvoll Befehle, und das Ganze ist nur einmal nötig."
build:
  - label: "Unter Linux"
    html: "<p>Zuerst die Werkzeuge installieren. Unter Arch:</p><pre><code>sudo pacman -S --needed base-devel cmake qt6-base qt6-tools sdl2 alsa-lib git</code></pre><p>Unter Debian oder Ubuntu:</p><pre><code>sudo apt install build-essential cmake qt6-base-dev qt6-tools-dev qt6-l10n-tools libsdl2-dev libasound2-dev git</code></pre><p>Dann den Quellcode auspacken und in seinem Ordner diese beiden Befehle ausführen:</p><pre><code>cmake -B build\ncmake --build build -j</code></pre><p><code>./build/nachtzug</code> startet das Programm.</p>"
  - label: "Auf dem Mac"
    html: "<p>Apples Befehlszeilenwerkzeuge (<code>xcode-select --install</code>) und <a href=\"https://brew.sh\">Homebrew</a> installieren, dann den Quellcode auspacken und in seinem Ordner dies ausführen:</p><pre><code>tools/build-macos.sh</code></pre><p>Es installiert alles Weitere, baut das Programm und packt es in ein Disk-Image.</p>"
  - label: "Unter Windows"
    html: "<p><a href=\"https://www.msys2.org\">MSYS2</a> installieren, aus dem Startmenü das Terminal <b>MSYS2 UCRT64</b> öffnen, dann den Quellcode auspacken und in seinem Ordner dies ausführen:</p><pre><code>tools/build-windows.sh</code></pre><p>Es installiert den Compiler und alles Weitere, baut Nachtzug und macht daraus ein Installationsprogramm (wenn <a href=\"https://jrsoftware.org/isinfo.php\">Inno Setup</a> installiert ist) oder ein Zip.</p>"

