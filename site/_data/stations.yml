# The journey through the program: one stop per part, in the order you'd meet them.
- time: "22:58"
  stop: "Keyboard Junction"
  title: "Play along on your computer keyboard"
  text: "Three rows of letter keys play three octaves, and every key is a note of the song’s scale. Press any of them: it fits. The pads on the screen light up as you play, and with Record on, what you play is written down for you, then tidied up with <b>Clean up</b> if you were a little wobbly."
  img: notes.png
  alt: "The note grid with a bass line, the inspector on the left and the timeline above"
- time: "23:06"
  stop: "Ideenfeld"
  title: "Ideas at the press of a button"
  text: "Stuck? <b>New idea</b> writes an acid line, a Berlin School sequence, a chord pattern, a melody or a beat for you, and <b>Vary</b> changes just a note or two. Notes you like can be kept, and the next idea writes around them. Right-click an empty spot for a bar of arpeggio or chord."
- time: "23:14"
  stop: "Drummer’s Rest"
  title: "A drummer who never gets tired"
  text: "Pick a style, from four on the floor to Motorik, and turn <b>Energy</b> up or down. The drummer plays ghost notes when it feels playful, and a fill every two, four or eight bars, all by itself."
  img: auto-drummer.png
  alt: "The auto drummer’s settings next to its drum grid"
- time: "23:21"
  stop: "Knob Street"
  title: "A real synthesiser on every track"
  text: "Two oscillators, a squelchy ladder filter, envelopes, an LFO, drive, echo and reverb, laid out in the order the sound flows, with live pictures of what each knob does. Press <b>Roll new sound</b> for a surprise, or <b>Mutate</b> for a little nudge."
  img: sound.png
  alt: "The Sound tab: oscillators, filter, envelopes and effects"
- time: "23:29"
  stop: "Simple Halt"
  title: "Or just eight big knobs"
  text: "Don’t want to see all of it? The <b>Simple</b> page has eight knobs with plain names, like <i>Brightness</i> and <i>Squelch</i>, which turn the right things underneath."
  img: simple-sound.png
  alt: "The Simple sound page with eight large knobs"
- time: "23:40"
  stop: "Loop Grid Sidings"
  title: "Jam like a live set"
  text: "Switch to <b>Loops</b> and every track gets a row of patterns. Start and stop them while the music plays; every change waits politely for the next bar, so it always lands in time."
  img: loops.png
  alt: "The loop grid: rows of patterns, one row per track"
- time: "23:52"
  stop: "Arrangement Viaduct"
  title: "From a loop to a whole song"
  text: "Arrange clips on the timeline yourself, or press <b>Arrange for me</b>: you get an intro, a build-up, a break and an ending, with filters opening and parts fading in and out."
  img: arranged.png
  alt: "A song laid out on the timeline after Arrange for me"
- time: "00:04"
  stop: "Mixer Hall"
  title: "Balance it all"
  text: "Volume, pan, echo and reverb for every track, mute and solo, and meters that tell you when it gets too loud."
  img: mixer.png
  alt: "The mixer with a strip per track"
- time: "00:15"
  stop: "Sample Yard"
  title: "Bring your own sounds"
  text: "65 sounds made for Nachtzug (nine of them recorded on a night train!), your own samples, or a drum loop chopped across the pads."
  img: chop.png
  alt: "Chopping a drum loop across the pads"
- time: "00:27"
  stop: "Lesson Halt"
  title: "Learn as you go"
  text: "Five short lessons walk you through the real program, one step at a time, and almost every button explains itself when you rest the mouse on it."
  img: lesson.png
  alt: "A lesson pointing at the New idea button"
- time: "00:38"
  stop: "Ember"
  title: "Six colour schemes"
  text: "From Bakelite, the warm enamel you see here, to Ember for late nights."
  img: dark-theme.png
  alt: "Nachtzug in the dark Ember colours"
- time: "00:51"
  stop: "Terminus"
  title: "Take it with you"
  text: "Export your song as a WAV file, as one file per track, or as MIDI for other music programs. MIDI keyboards, controller knobs and MIDI clock all work, too."
