# The download tickets, drawn as Edmondson card tickets. "file" is looked for in downloads/ (the build puts it there);
# downloads/latest.json adds the version, size and date. "card" is the short line printed on the card, "colour" the
# card's colour: first (green, first class), second (brown), white (the plain card used when the coloured ones ran out),
# striped (brown with a red stripe).
- id: linux
  system: Linux
  what: AppImage, one file
  file: Nachtzug-x86_64.AppImage
  valid: "64-bit PCs · distributions from 2025 on"
  how: "Download it, make it runnable (right-click → Properties → Allow executing, or <code>chmod +x Nachtzug-x86_64.AppImage</code>) and double-click it. Nothing gets installed."
  class: "1"
  card: "Linux · AppImage"
  colour: first
