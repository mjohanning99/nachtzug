# The download tickets, drawn as Edmondson card tickets. "file" is looked for in downloads/ (the build puts it there);
# downloads/latest.json adds the version, size and date. "card" is the short line printed on the card, "colour" the
# card's colour: first (green, first class), second (brown), white (the plain card used when the coloured ones ran out),
# striped (brown with a red stripe).
- id: linux
  system: Linux
  what: AppImage, one file
  file: Nachtzug-x86_64.AppImage
  valid: "64-bit PCs · distributions from 2025 on"
  how: "Download it, make it runnable (right-click → Properties → Allow executing, or <code>chmod +x Nachtzug-x86_64.AppImage</code>) and double-click it. Nothing gets installed."
  class: "1"
  card: "Linux · AppImage"
  colour: first
- id: mac
  system: macOS
  what: a disk image
  file: Nachtzug-macOS.dmg
  valid: "Macs with Apple Silicon · macOS 15 Sequoia or newer"
  how: "Open it and drag Nachtzug into Applications. The first time, macOS says it can’t check it, as it isn’t signed by a registered Apple developer: click <b>Done</b>, then <b>Open Anyway</b> in System Settings → Privacy &amp; Security."
  class: "2"
  card: "macOS · disk image"
  colour: second
- id: windows
  system: Windows
  what: an installer
  file: Nachtzug-Windows-Setup.exe
  valid: "Windows 10 and 11 · 64-bit"
  how: "Run the installer. Windows may warn about an unknown publisher: choose <b>More info</b>, then <b>Run anyway</b>. The Windows version is brand new, so please <a href=\"https://github.com/mjohanning99/nachtzug/issues\">tell me</a> if anything goes wrong."
  class: "2"
  card: "Windows · installer"
  colour: white
- id: source
  system: Source code
  what: for tinkerers
  file: Nachtzug-source.tar.gz
  valid: "Linux, macOS, Windows · <span class=\"nw\">C++20</span>, Qt 6, SDL2"
  how: "A handful of commands and you have the very newest Nachtzug. The steps are below, and in the README inside."
  class: "2"
  card: "Source code · C++20"
  colour: striped
