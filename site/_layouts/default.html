<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ '/' | relative_url }}">
  <meta property="og:image" content="{{ site.url }}{{ '/assets/img/social-preview.png' | relative_url }}">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="The Nachtzug enamel sign under a painting of a night train along the Rhine">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ebe5d8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2b2623" media="(prefers-color-scheme: dark)">
  {% if site.release_api %}<meta name="nz-release-api" content="{{ site.release_api }}">
  {% endif %}<link rel="icon" href="{{ '/assets/img/logo-small.png' | relative_url }}" sizes="64x64">
  <link rel="icon" href="{{ '/assets/img/logo.png' | relative_url }}" sizes="512x512">
  <link rel="preload" href="{{ '/assets/fonts/antiqua-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/antiqua-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/jost-500.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  {% include flourish.svg %}
  {% include topbar.html %}
  {{ content }}
  {% include footer.html %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
